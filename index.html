<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台味翻譯官｜兩岸用語抓詞小遊戲</title>
  <style>
    :root {
      --bg: #f6f2e9;
      --card: #fffdf9;
      --ink: #22252a;
      --muted: #666c75;
      --accent: #e05a2b;
      --accent-soft: #fff0ea;
      --ok: #1f8a5b;
      --ok-soft: #e8f7f0;
      --bad: #c93b3b;
      --bad-soft: #fdecec;
      --border: #e5dec9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top right, #fff5dc, var(--bg) 60%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(34, 37, 42, 0.08);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .title-group h1 {
      font-size: 1.45rem;
      letter-spacing: 0.5px;
    }

    .title-group p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .stats {
      display: flex;
      gap: 10px;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .badge {
      background: #f2ede2;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .badge.danger {
      background: var(--bad-soft);
      color: var(--bad);
      border-color: #f6c7c7;
    }

    .progress-wrap {
      height: 8px;
      background: #eee8da;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f08a24, var(--accent));
      transition: width 0.3s ease;
    }

    .category-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .instruction {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .sentence-box {
      background: #faf6ee;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      font-size: 1.25rem;
      line-height: 1.9;
      margin-bottom: 18px;
    }

    .token {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 1px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      border-bottom: 2px dashed transparent;
    }

    .token:hover {
      background: #fff0d4;
      border-bottom-color: var(--accent);
    }

    .token.selected {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      border: 1.5px solid var(--accent);
      border-bottom-style: solid;
    }

    .token.replaced {
      background: var(--ok-soft);
      color: var(--ok);
      font-weight: 700;
      border: 1.5px solid var(--ok);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    @media (max-width: 520px) {
      .choices {
        grid-template-columns: 1fr;
      }
      .sentence-box {
        font-size: 1.1rem;
      }
    }

    .choice-btn {
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease;
      text-align: center;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .choice-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .feedback {
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: none;
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .feedback.ok {
      display: block;
      background: var(--ok-soft);
      border: 1px solid #9fd8be;
      color: #135c3b;
    }

    .feedback.bad {
      display: block;
      background: var(--bad-soft);
      border: 1px solid #f2b6b6;
      color: #872020;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 11px 20px;
      border-radius: 12px;
      border: none;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: #ece6d8;
      color: var(--ink);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .result-box {
      text-align: center;
      padding: 12px 0;
    }

    .result-score {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--accent);
      margin: 8px 0;
    }

    .result-rank {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .result-note {
      color: var(--muted);
      font-size: 0.94rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="header">
      <div class="title-group">
        <h1>台味翻譯官</h1>
        <p>抓出句子裡的大陸用語，換成道地台灣慣用語</p>
      </div>
      <div class="stats">
        <span class="badge" id="qCounter">第 1 / 8 題</span>
        <span class="badge" id="scoreBadge">得分：0</span>
        <span class="badge" id="comboBadge">連擊：0</span>
        <span class="badge" id="timerBadge">⏱ 15s</span>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="gameView">
      <span class="category-tag" id="categoryTag">日常生活</span>
      <p class="instruction" id="instructionText">
        步驟 1：先點選句子中覺得「怪怪的」詞彙；步驟 2：再從下方挑出正確的台灣用語替換！
      </p>

      <div class="sentence-box" id="sentenceBox"></div>

      <div class="choices" id="choicesBox"></div>

      <div class="feedback" id="feedbackBox"></div>

      <div class="actions">
        <button class="btn btn-secondary" id="hintBtn" type="button">提示（-20分）</button>
        <button class="btn btn-primary" id="nextBtn" type="button" disabled>下一題</button>
      </div>
    </div>

    <div id="resultView" style="display: none;"></div>
  </div>

  <script>
    const QUESTION_BANK = [
      {
        id: 1,
        category: "日常生活",
        segments: ["老闆，我要一份炸", "土豆", "條配飲料！"],
        targetWord: "土豆",
        answer: "馬鈴薯",
        options: ["馬鈴薯", "花生", "地瓜", "芋頭"],
        tip: "台灣說的「土豆」通常指花生，炸薯條的原料是「馬鈴薯」。"
      },
      {
        id: 2,
        category: "日常生活",
        segments: ["天氣好熱，快把", "空調", "打開吧！"],
        targetWord: "空調",
        answer: "冷氣",
        options: ["冷氣", "電扇", "除濕機", "暖氣"],
        tip: "台灣口語習慣說「冷氣」，「空調」多見於中央空調或工程用語。"
      },
      {
        id: 3,
        category: "日常生活",
        segments: ["快來不及了，我們直接", "打車", "過去。"],
        targetWord: "打車",
        answer: "搭計程車",
        options: ["搭計程車", "騎腳踏車", "搭公車", "走路"],
        tip: "「打車」源自粵語對計程車的簡稱，台灣多說「搭計程車」或「叫車」。"
      },
      {
        id: 4,
        category: "日常生活",
        segments: ["手指被紙割到了，快拿張", "創可貼", "來。"],
        targetWord: "創可貼",
        answer: "OK繃",
        options: ["OK繃", "紗布", "透氣膠帶", "棉花棒"],
        tip: "台灣受日本影響，習慣稱這類貼布為「OK繃」。"
      },
      {
        id: 5,
        category: "科技網路",
        segments: ["這個創作者的新", "視頻", "剪得超好笑。"],
        targetWord: "視頻",
        answer: "影片",
        options: ["影片", "音檔", "直播", "貼文"],
        tip: "英文 Video 在台灣普遍譯為「影片」，大陸則常稱「視頻」。"
      },
      {
        id: 6,
        category: "科技網路",
        segments: ["報告檔案記得存進", "U盤", "再帶去學校。"],
        targetWord: "U盤",
        answer: "隨身碟",
        options: ["隨身碟", "行動硬碟", "記憶卡", "光碟"],
        tip: "USB 隨身碟在台灣多簡稱「隨身碟」，大陸則常見「U盤」。"
      },
      {
        id: 7,
        category: "科技網路",
        segments: ["電腦的", "鼠標", "突然沒電不能動了。"],
        targetWord: "鼠標",
        answer: "滑鼠",
        options: ["滑鼠", "鍵盤", "觸控板", "螢幕"],
        tip: "台灣依外型與滑動操作稱為「滑鼠」，大陸則多稱「鼠標」。"
      },
      {
        id: 8,
        category: "科技網路",
        segments: ["幫我把這段聊天紀錄", "截屏", "傳給我。"],
        targetWord: "截屏",
        answer: "截圖",
        options: ["截圖", "錄影", "轉發", "收藏"],
        tip: "台灣習慣說「螢幕截圖」或直接簡稱「截圖」。"
      },
      {
        id: 9,
        category: "校園流行",
        segments: ["這家店份量大又便宜，", "性價比", "超高！"],
        targetWord: "性價比",
        answer: "CP值",
        options: ["CP值", "顏值", "價值", "折扣"],
        tip: "台灣年輕人與網購常說「CP值」（性價比），源自英文 Cost-Performance。"
      },
      {
        id: 10,
        category: "校園流行",
        segments: ["下課後", "班主任", "叫你去辦公室一趟。"],
        targetWord: "班主任",
        answer: "班導",
        options: ["班導", "教官", "學長", "舍監"],
        tip: "台灣國高中習慣簡稱班級導師為「班導」，大陸則稱「班主任」。"
      }
    ];

    const ROUNDS = 8;
    const TIME_PER_Q = 15;
    const STORAGE_KEY = "taiwan_vocab_mastered_v1";

    let questions = [];
    let currentIdx = 0;
    let score = 0;
    let combo = 0;
    let correctCount = 0;
    let selectedWord = null;
    let answered = false;
    let replacedText = null;
    let timeLeft = TIME_PER_Q;
    let timerId = null;

    const qCounterEl = document.getElementById("qCounter");
    const scoreBadgeEl = document.getElementById("scoreBadge");
    const comboBadgeEl = document.getElementById("comboBadge");
    const timerBadgeEl = document.getElementById("timerBadge");
    const progressBarEl = document.getElementById("progressBar");
    const categoryTagEl = document.getElementById("categoryTag");
    const instructionTextEl = document.getElementById("instructionText");
    const sentenceBoxEl = document.getElementById("sentenceBox");
    const choicesBoxEl = document.getElementById("choicesBox");
    const feedbackBoxEl = document.getElementById("feedbackBox");
    const hintBtnEl = document.getElementById("hintBtn");
    const nextBtnEl = document.getElementById("nextBtn");
    const gameViewEl = document.getElementById("gameView");
    const resultViewEl = document.getElementById("resultView");

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function loadMastered() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveMastered(word) {
      const list = new Set(loadMastered());
      list.add(word);
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...list]));
    }

    function startGame() {
      questions = shuffle(QUESTION_BANK).slice(0, ROUNDS);
      currentIdx = 0;
      score = 0;
      combo = 0;
      correctCount = 0;
      gameViewEl.style.display = "block";
      resultViewEl.style.display = "none";
      loadQuestion();
    }

    function startTimer() {
      clearInterval(timerId);
      timeLeft = TIME_PER_Q;
      updateTimerUI();

      timerId = setInterval(() => {
        if (answered) return;
        timeLeft -= 1;
        updateTimerUI();
        if (timeLeft <= 0) {
          clearInterval(timerId);
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerUI() {
      timerBadgeEl.textContent = `⏱ ${Math.max(0, timeLeft)}s`;
      timerBadgeEl.classList.toggle("danger", timeLeft <= 5 && !answered);
    }

    function updateStats() {
      qCounterEl.textContent = `第 ${currentIdx + 1} / ${questions.length} 題`;
      scoreBadgeEl.textContent = `得分：${score}`;
      comboBadgeEl.textContent = `連擊：${combo}`;
      progressBarEl.style.width = `${(currentIdx / questions.length) * 100}%`;
    }

    function renderSentence() {
      const q = questions[currentIdx];
      sentenceBoxEl.innerHTML = "";

      q.segments.forEach((seg, idx) => {
        if (idx === 1) {
          const span = document.createElement("span");
          span.className = "token";
          if (replacedText) {
            span.classList.add("replaced");
            span.textContent = replacedText;
          } else {
            if (selectedWord === seg) span.classList.add("selected");
            span.textContent = seg;
          }

          span.addEventListener("click", () => {
            if (answered) return;
            selectedWord = seg;
            renderSentence();
            instructionTextEl.textContent = `已選取「${seg}」，請從下方選擇正確的台灣用語替換！`;
          });
          sentenceBoxEl.appendChild(span);
        } else {
          sentenceBoxEl.appendChild(document.createTextNode(seg));
        }
      });
    }

    function renderChoices() {
      const q = questions[currentIdx];
      choicesBoxEl.innerHTML = "";
      shuffle(q.options).forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";
        btn.textContent = opt;
        btn.disabled = answered;
        btn.addEventListener("click", () => handleAnswer(opt));
        choicesBoxEl.appendChild(btn);
      });
    }

    function loadQuestion() {
      const q = questions[currentIdx];
      selectedWord = null;
      answered = false;
      replacedText = null;

      categoryTagEl.textContent = q.category;
      instructionTextEl.textContent =
        "步驟 1：先點選句子中覺得「怪怪的」詞彙；步驟 2：再從下方挑出正確的台灣用語替換！";
      feedbackBoxEl.className = "feedback";
      feedbackBoxEl.style.display = "none";
      feedbackBoxEl.textContent = "";
      hintBtnEl.disabled = false;
      nextBtnEl.disabled = true;
      nextBtnEl.textContent = currentIdx === questions.length - 1 ? "查看結算" : "下一題";

      updateStats();
      renderSentence();
      renderChoices();
      startTimer();
    }

    function handleAnswer(chosenTaiwanWord) {
      if (answered) return;
      const q = questions[currentIdx];

      if (!selectedWord) {
        feedbackBoxEl.className = "feedback bad";
        feedbackBoxEl.style.display = "block";
        feedbackBoxEl.textContent = "請先點選句子裡要替換的詞彙，再按下方選項喔！";
        return;
      }

      answered = true;
      clearInterval(timerId);
      hintBtnEl.disabled = true;
      nextBtnEl.disabled = false;
      choicesBoxEl.querySelectorAll("button").forEach((b) => (b.disabled = true));

      const wordMatched = selectedWord === q.targetWord;
      const optionMatched = chosenTaiwanWord === q.answer;

      if (wordMatched && optionMatched) {
        combo += 1;
        correctCount += 1;
        const gained = 100 + Math.max(0, combo - 1) * 20;
        score += gained;
        replacedText = chosenTaiwanWord;
        saveMastered(q.targetWord);

        feedbackBoxEl.className = "feedback ok";
        feedbackBoxEl.innerHTML = `<strong>答對了！（+${gained} 分）</strong> 「${q.targetWord}」→「${q.answer}」<br>${q.tip}`;
      } else {
        combo = 0;
        score = Math.max(0, score - 20);
        replacedText = q.answer;

        feedbackBoxEl.className = "feedback bad";
        feedbackBoxEl.innerHTML = `<strong>差一點！</strong> 正確目標是「${q.targetWord}」，台灣慣用語為「${q.answer}」。<br>${q.tip}`;
      }

      renderSentence();
      updateStats();
    }

    function handleTimeout() {
      if (answered) return;
      const q = questions[currentIdx];
      answered = true;
      combo = 0;
      replacedText = q.answer;
      hintBtnEl.disabled = true;
      nextBtnEl.disabled = false;
      choicesBoxEl.querySelectorAll("button").forEach((b) => (b.disabled = true));

      feedbackBoxEl.className = "feedback bad";
      feedbackBoxEl.innerHTML = `<strong>時間到！</strong> 正確目標是「${q.targetWord}」，台灣慣用語為「${q.answer}」。<br>${q.tip}`;
      renderSentence();
      updateStats();
    }

    hintBtnEl.addEventListener("click", () => {
      if (answered) return;
      const q = questions[currentIdx];
      selectedWord = q.targetWord;
      score = Math.max(0, score - 20);
      hintBtnEl.disabled = true;
      renderSentence();
      updateStats();
      instructionTextEl.textContent = `已幫你標出「${q.targetWord}」（-20 分），請挑出正確的台灣用語！`;
    });

    nextBtnEl.addEventListener("click", () => {
      currentIdx += 1;
      if (currentIdx < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    });

    function showResult() {
      clearInterval(timerId);
      progressBarEl.style.width = "100%";
      gameViewEl.style.display = "none";
      resultViewEl.style.display = "block";

      const masteredCount = loadMastered().length;
      let rank = "台灣用語新手";
      if (correctCount >= 7) rank = "道地台味鑑定師";
      else if (correctCount >= 5) rank = "敏銳語感觀察家";
      else if (correctCount >= 3) rank = "日常用語小達人";

      resultViewEl.innerHTML = `
        <div class="result-box">
          <div>本局結算</div>
          <div class="result-score">${score} 分</div>
          <div class="result-rank">稱號：${rank}（答對 ${correctCount} / ${questions.length} 題）</div>
          <p class="result-note">
            圖鑑累計已掌握 <strong>${masteredCount} / ${QUESTION_BANK.length}</strong> 組詞彙。你可以把題庫擴充到 30 題，加入更多關卡或結局！
          </p>
          <button class="btn btn-primary" type="button" id="restartBtn">再玩一局</button>
        </div>
      `;

      document.getElementById("restartBtn").addEventListener("click", startGame);
    }

    startGame();
  </script>
</body>
</html>
